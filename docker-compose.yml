services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: vending
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vending_map
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vending -d vending_map"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgres://vending:password@postgres:5432/vending_map
      RUST_LOG: info
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      DAILY_SECRET: change-me-in-production
      UPLOAD_DIR: /app/uploads
      ANALYZE_SCRIPT: /app/scripts/analyze_image.py
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18080:8080"
    volumes:
      - uploads_data:/app/uploads

  nginx:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - backend

  sync:
    build:
      context: .
      dockerfile: ./docker/sync.Dockerfile
    environment:
      DATABASE_URL: postgres://vending:password@postgres:5432/vending_map
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./scripts:/scripts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
